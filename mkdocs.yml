site_name: Data Engineering Knowledge Base
site_description: Introductory reference for data engineers — traditional DWH, modern warehousing, and everything in between.
site_author: ""
repo_url: ""  # add your GitHub repo URL here

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md

  - Getting Started:
    - getting-started/index.md
    - What is Data Engineering?: getting-started/what-is-de.md
    - Key Roles & Skills: getting-started/roles-and-skills.md
    - Core Concepts Glossary: getting-started/glossary.md

  - Traditional Data Warehousing:
