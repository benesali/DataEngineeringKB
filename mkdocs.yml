    - Inmon (3NF / Enterprise DWH): traditional-dwh/inmon.md
    - Kimball (Dimensional Modeling): traditional-dwh/kimball.md
    - Data Vault: traditional-dwh/data-vault.md
    - Operational Data Store (ODS): traditional-dwh/ods.md
